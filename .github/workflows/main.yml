name: main

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
         image: mysql:8
         env:
           MYSQL_ROOT_PASSWORD: root
           MYSQL_DATABASE: tasks_test
         ports:
           - 3306:3306
         options: >-
           --health-cmd="mysqladmin ping"
           --health-interval=10s
           --health-timeout=5s
           --health-retries=5
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: tasks_test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/tasks_test

    steps: 
      - name: Download the code
        uses: actions/checkout@v4
    
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install dependencies
        run: npm ci
    
      - name: Generate prisma client
        run: npx prisma generate
    
      - name: Apply the schema to the database test
        run: npx prisma db push
    
      - name: Run the tests
        run: npm test
